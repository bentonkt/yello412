# Cloudflare Worker: serves the built site from ./dist and runs the demo line's
# backend under /api (worker/index.js).
#
# `npm run deploy` builds and publishes it. Point yello412.com at it under
# Workers & Pages > yello412-site > Settings > Domains & Routes.
# Secrets: see .dev.vars.example (`npx wrangler secret put NAME` for each).

name = "yello412-site"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = ["/api/*"]

[vars]
# The Twilio number the demo texts and emergency rings come from, e.g. "+14125550100".
TWILIO_FROM = ""
# Optional sender for alert emails; must be on a domain with Email Routing on. Default demo@yello412.com.
# ALERT_FROM = "demo@yello412.com"

# Alert emails to the team (each demo call, each YES reply). Needs yello412.com on Cloudflare
# with Email Routing on, and each ALERT_TO address verified under Email Routing > Destination
# addresses. Then uncomment this, set the ALERT_TO secret and deploy. Until then alerts only
# go to the Worker log (`npx wrangler tail`).
# [[send_email]]
# name = "ALERT_EMAIL"

# Dedupes Retell retries, caps demo texts at 3 per number per day, and caps demo calls at
# callsPerDay (agent/demo-agent.json). Without it nothing is capped.
[[kv_namespaces]]
binding = "DEMO_KV"
id = "a9296d4158074821bc5130d402e63beb"
