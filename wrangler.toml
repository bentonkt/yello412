# Cloudflare Worker that serves the built site from ./dist.
# `npm run deploy` builds and publishes it. Point yello412.com at it under
# Workers & Pages > yello412-site > Settings > Domains & Routes.
#
# The phone-line backend (Retell webhooks, owner texts) can live in this same
# Worker later: add `main = "src/worker.js"` and
# `run_worker_first = ["/api/*"]` under [assets].

name = "yello412-site"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
