# Cloudflare Worker: serves the built site from ./dist and runs the demo line's
# backend under /api (worker/index.js).
#
# `npm run deploy` builds and publishes it. The [[routes]] below put yello412.com on it.
# Secrets: see .dev.vars.example (`npx wrangler secret put NAME` for each).

name = "yello412-site"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# yello412.com and www on this Worker; deploy makes their DNS records and certificates.
# Uncomment once yello412.com shows Active in Cloudflare (README > Deploy). Until the domain
# is on Cloudflare, deploy can't attach it.
# [[routes]]
# pattern = "yello412.com"
# custom_domain = true
#
# [[routes]]
# pattern = "www.yello412.com"
# custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = ["/api/*"]

[vars]
# The Twilio number the demo texts and emergency rings come from, e.g. "+14125550100".
TWILIO_FROM = ""
# Optional sender for alert emails; must be on a domain with Cloudflare Email Sending on.
# Default demo@yello412.com.
# ALERT_FROM = "demo@yello412.com"

# Alert emails to the team (each demo call, each YES reply). Needs yello412.com on Cloudflare
# with Email Sending on (`npx wrangler email sending enable yello412.com`). Not Email Routing:
# that takes the MX from Google Workspace. Then uncomment this, set the ALERT_TO secret and
# deploy. Until then alerts only go to the Worker log (`npx wrangler tail`).
# [[send_email]]
# name = "ALERT_EMAIL"

# Dedupes Retell retries, caps demo texts at 3 per number per day, and caps demo calls at
# callsPerDay (agent/demo-agent.json). Without it nothing is capped.
[[kv_namespaces]]
binding = "DEMO_KV"
id = "a9296d4158074821bc5130d402e63beb"
